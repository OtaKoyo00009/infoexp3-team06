<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Team06 MiniBoard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main>
        <h1>MiniBoard</h1>
        <p>チームで育てるとても大きなWebアプリ</p>
        <form id="form"><input id="name" maxlength="30" placeholder="Nickname" required><textarea id="message"
                maxlength="300" placeholder="Message" required></textarea><button>投稿</button></form>
        <p id="status"></p>
        <div class="toolbar">
            <label for="sort">並べ替え</label>
            <select id="sort">
                <option value="new">新しい順</option>
                <option value="old">古い順</option>
                <option value="hard">難しい順</option>
                <option value="easy">簡単な順</option>
            </select>
        </div>
        <section id="messages"></section>
    </main>
    <script src="/static/app.js"></script>
</body>

</html>
