
<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Team06 MiniBoard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main>
        <h1>MiniBoard</h1>
        <p>みんなでクイズを投稿・共有できるWebアプリ</p>

        <!-- クイズ投稿フォーム -->
        <form id="form">
            <input
                id="name"
                type="text"
                maxlength="30"
                placeholder="Nickname"
                required
            >

            <textarea
                id="question"
                maxlength="300"
                placeholder="問題文"
                required
            ></textarea>

            <textarea
                id="answer"
                maxlength="300"
                placeholder="解答"
                required
            ></textarea>

            <button type="submit">クイズを投稿</button>
        </form>

        <p id="status"></p>

        <!-- 並べ替え機能 -->
        <div class="toolbar">
            <label for="sort">並べ替え</label>
            <select id="sort">
                <option value="new">新しい順</option>
                <option value="old">古い順</option>
                <option value="hard">難しい順</option>
                <option value="easy">簡単な順</option>
            </select>
        </div>

        <!-- クイズ一覧 -->
        <h2>投稿されたクイズ</h2>
        <section id="quizzes"></section>

    </main>

    <script src="/static/app.js"></script>
</body>

</html>
